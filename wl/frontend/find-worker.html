<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WorkLink - Find Workers</title>

    <!-- IMPORTANT: correct CSS file -->
    <link
        rel="stylesheet"
        href="css/find-worker.css"
    >

</head>


<body>


    <!-- =====================================
         NAVBAR
    ====================================== -->

    <header class="navbar">

        <div class="logo">
            <span>Work</span><b>Link</b>
        </div>


        <a
            href="boss-dashboard.html"
            class="back-btn"
        >
            ← Dashboard
        </a>

    </header>



    <!-- =====================================
         MAIN CONTAINER
    ====================================== -->

    <main class="container">


        <!-- =================================
             PAGE HEADING
        ================================== -->

        <section class="page-heading">

            <p>
                WORKLINK TALENT
            </p>

            <h1>
                Find Skilled Workers 🔍
            </h1>

            <span>
                Search workers by name, skill or location.
            </span>

        </section>



        <!-- =================================
             SEARCH
        ================================== -->

        <section class="search-box">


            <div class="search-input">

                <span>
                    🔍
                </span>


                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by worker name, skill or location..."
                >

            </div>


            <button
                type="button"
                id="searchBtn"
                class="search-btn"
            >
                Search
            </button>


        </section>



        <!-- =================================
             FILTERS
        ================================== -->

        <section class="filters">


            <button
                type="button"
                class="filter active"
                data-filter="all"
            >
                All
            </button>


            <button
                type="button"
                class="filter"
                data-filter="construction"
            >
                🏗️ Construction
            </button>


            <button
                type="button"
                class="filter"
                data-filter="electrician"
            >
                🔧 Electrician
            </button>


            <button
                type="button"
                class="filter"
                data-filter="plumber"
            >
                🔧 Plumber
            </button>


            <button
                type="button"
                class="filter"
                data-filter="driver"
            >
                🚗 Driver
            </button>


        </section>



        <!-- =================================
             RESULTS HEADER
        ================================== -->

        <div class="results-header">


            <div>

                <h2>
                    Available Workers
                </h2>


                <p id="resultCount">
                    Showing available opportunities
                </p>

            </div>


            <select id="sortSelect">

                <option value="default">
                    Sort By
                </option>


                <option value="salary-high">
                    Salary: High to Low
                </option>


                <option value="salary-low">
                    Salary: Low to High
                </option>

            </select>


        </div>



        <!-- =================================
             JOBS
        ================================== -->

        <section
            class="jobs"
            id="jobsContainer"
        >
        </section>

        <div id="noResults" class="no-results" style="display:none;">
            <div class="no-results-icon">🔍</div>
            <h3>No workers found</h3>
            <p>Try another name, skill or location.</p>
        </div>
    </main>
    <script src="js/security.js"></script>
    <script src="js/find-worker.js"></script>
</body>
</html>
