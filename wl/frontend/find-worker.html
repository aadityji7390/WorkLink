<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WorkLink - Find Workers</title>

    <link
        rel="stylesheet"
        href="css/find-worker.css"
    >

</head>


<body>

<header class="navbar">

    <div class="logo">
        <span>Work</span><b>Link</b>
    </div>

    <a
        href="boss-dashboard.html"
        class="back-btn"
    >
        ← Dashboard
    </a>

</header>


<main class="container">

    <section class="page-heading">

        <p>
            WORKLINK WORKERS
        </p>

        <h1>
            Find Workers 👷
        </h1>

        <span>
            Search workers by name, skill or location.
        </span>

    </section>


    <section class="search-box">

        <div class="search-input">

            <span>
                🔍
            </span>

            <input
                type="text"
                id="searchInput"
                placeholder="Search by worker name, skill or location..."
            >

        </div>

        <button
            type="button"
            id="searchBtn"
            class="search-btn"
        >
            Search
        </button>

    </section>


    <section class="filters">

        <button
            type="button"
            class="filter active"
            data-filter="all"
        >
            All
        </button>

        <button
            type="button"
            class="filter"
            data-filter="construction"
        >
            🏗️ Construction
        </button>

        <button
            type="button"
            class="filter"
            data-filter="electrician"
        >
            🔧 Electrician
        </button>

        <button
            type="button"
            class="filter"
            data-filter="plumber"
        >
            🔧 Plumber
        </button>

        <button
            type="button"
            class="filter"
            data-filter="driver"
        >
            🚗 Driver
        </button>

    </section>


    <div class="results-header">

        <div>

            <h2>
                Available Workers
            </h2>

            <p id="resultCount">
                Loading workers...
            </p>

        </div>

    </div>


    <!-- IMPORTANT:
         No dummy workers here.
         JavaScript will load workers from backend.
    -->

    <section
        class="jobs"
        id="jobsContainer"
    >
    </section>


    <div
        id="noResults"
        class="no-results"
        style="display:none;"
    >

        <div class="no-results-icon">
            🔍
        </div>

        <h3>
            No workers found
        </h3>

        <p>
            Try another worker name, skill or location.
        </p>

    </div>

</main>


<script src="js/find-worker.js"></script>

</body>

</html>
