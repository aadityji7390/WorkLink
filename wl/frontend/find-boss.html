<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkLink - Find Employers</title>
    <link rel="stylesheet" href="css/find-worker.css">
</head>
<body>
<header class="navbar">
    <div class="logo"><span>Work</span><b>Link</b></div>
    <a href="worker-dashboard.html" class="back-btn">← Dashboard</a>
</header>

<main class="container">
    <section class="page-heading">
        <p>WORKLINK EMPLOYERS</p>
        <h1>Find Employers 💼</h1>
        <span>Find employers by name, company, work type or work location.</span>
    </section>

    <section class="search-box">
        <div class="search-input">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="Search employer, company, work or location...">
        </div>
        <button type="button" id="searchBtn" class="search-btn">Search</button>
    </section>

    <section class="filter-panel">
        <div class="filter-title">
            <strong>Find employers by work</strong>
            <span>Choose a category to narrow your results</span>
        </div>
        <div class="filters">
            <button class="filter active" data-filter="all" type="button">All</button>
            <button class="filter" data-filter="construction" type="button">🏗️ Construction</button>
            <button class="filter" data-filter="electrician" type="button">🔧 Electrician</button>
            <button class="filter" data-filter="plumber" type="button">🔧 Plumber</button>
            <button class="filter" data-filter="driver" type="button">🚗 Driver</button>
            <button class="filter" data-filter="maintenance" type="button">🛠️ Maintenance</button>
            <button class="filter" data-filter="other" type="button">Other</button>
        </div>
    </section>

    <div class="results-header">
        <div>
            <h2>Employers</h2>
            <p id="resultCount">Loading employers...</p>
        </div>
    </div>

    <section class="jobs" id="bossesContainer"></section>

    <div id="noResults" class="no-results">
        <div class="no-results-icon">🔍</div>
        <h3>No employers found</h3>
        <p>Try another name, company, work category or location.</p>
    </div>
</main>

<script src="js/security.js"></script>
<script src="js/find-boss.js"></script>
</body>
</html>
