<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkLink - Rate & Review</title>

    <link rel="stylesheet" href="css/rating.css">
</head>

<body>

<div class="rating-container">

    <div class="rating-card">

        <div class="rating-header">
            <div class="rating-icon">⭐</div>

            <h1>Rate & Review</h1>

            <p id="targetText">
                Share your experience
            </p>
        </div>

        <div class="rating-box">

            <h3>How was your experience?</h3>

            <div class="stars" id="stars">

                <button data-rating="1">★</button>
                <button data-rating="2">★</button>
                <button data-rating="3">★</button>
                <button data-rating="4">★</button>
                <button data-rating="5">★</button>

            </div>

            <p id="ratingText">
                Select a rating
            </p>

            <textarea
                id="review"
                maxlength="500"
                placeholder="Write a review about your experience..."
            ></textarea>

            <div class="char-count">
                <span id="charCount">0</span>/500
            </div>

            <button
                id="submitRating"
                class="submit-btn"
            >
                Submit Rating
            </button>

        </div>

        <p id="message"></p>

    </div>

</div>

<script src="js/rating.js"></script>

</body>
</html>
