<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WorkLink - Register</title>

    <link
        rel="stylesheet"
        href="css/register.css"
    >

</head>

<body>

    <div class="register-container">

        <div class="register-box">

            <div class="logo">
                <span>Work</span><b>Link</b>
            </div>

            <h1>Create Account</h1>

            <p class="subtitle">
                Join WorkLink today
            </p>

            <form id="registerForm">

                <div class="input-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>

                <div class="input-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="input-group">
                    <label>Skill</label>
                    <input type="text" id="skill" placeholder="e.g. Electrician, Plumber">
                </div>

                <div class="input-group">
                    <label>Location</label>
                    <input type="text" id="location" placeholder="City / Area">
                </div>

                <div class="input-group" id="companyGroup">
                    <label>Company Name</label>
                    <input type="text" id="company" placeholder="Company / Business name">
                </div>

                <div class="input-group">

                    <label>Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter phone number"
                        required
                    >

                </div>

                <div class="input-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create password"
                        required
                    >

                </div>

                <div class="input-group">

                    <label>Register As</label>

                    <select id="role">

                        <option value="worker">
                            Worker
                        </option>

                        <option value="boss">
                            Boss
                        </option>

                    </select>

                </div>

                <button
                    type="submit"
                    class="register-btn"
                >
                    Create Account
                </button>

            </form>

            <p class="login-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Home
            </a>

        </div>

    </div>

    <script src="js/security.js"></script>
    <script src="js/register.js"></script>

</body>

</html>
