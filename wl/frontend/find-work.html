<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkLink - Find Employers</title>
    <link rel="stylesheet" href="css/find-worker.css">
</head>

<body>

<header class="navbar">
    <div class="logo">
        <span>Work</span><b>Link</b>
    </div>

    <a href="worker-dashboard.html" class="back-btn">← Dashboard</a>
</header>

<main class="container">

    <section class="page-heading">
        <p>EMPLOYMENT OPPORTUNITIES</p>
        <h1>Find Employers 🔍</h1>
        <span>Search employers by name, company, skill or location.</span>
    </section>

    <section class="search-box">
        <div class="search-input">
            <span>🔍</span>
            <input
                id="searchInput"
                type="text"
                placeholder="Search employer, company, skill or location..."
            >
        </div>

        <button id="searchBtn" class="search-btn" type="button">
            Search
        </button>
    </section>

    <section class="filters">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="construction">🏗️ Construction</button>
        <button class="filter" data-filter="electrician">🔧 Electrician</button>
        <button class="filter" data-filter="plumber">🔧 Plumber</button>
        <button class="filter" data-filter="driver">🚗 Driver</button>
    </section>

    <div class="results-header">
        <div>
            <h2>Available Employers</h2>
            <p id="resultCount">Loading employers...</p>
        </div>
    </div>

    <section class="jobs" id="jobsContainer"></section>

    <div id="noResults" class="no-results" style="display:none">
        <div class="no-results-icon">🔍</div>
        <h3>No employers found</h3>
        <p>Try another employer name, skill or location.</p>
    </div>

</main>

<script src="js/security.js"></script>
<script src="js/find-work.js"></script>

</body>
</html>
